<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      /* Pre-paint theme, RTL direction & HMR/chunk recovery */
      (function() {
        if (typeof window === 'undefined') return;
        try {
          var savedTheme = localStorage.getItem('app_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var params = new URLSearchParams(window.location.search);
          var urlLang = params.get('lang');
          var savedLang = urlLang === 'dv' || urlLang === 'en'
            ? urlLang
            : (localStorage.getItem('library_locale') || localStorage.getItem('locale') || localStorage.getItem('app_lang'));
          var isDv = savedLang === 'dv';
          document.documentElement.dir = isDv ? 'rtl' : 'ltr';
          document.documentElement.lang = isDv ? 'dv' : 'en';
          if (isDv) {
            document.documentElement.classList.add('rtl-mode');
          } else {
            document.documentElement.classList.remove('rtl-mode');
          }
        } catch (e) {}

        /* Auto-recover once from stale hashed JS chunk errors after a fresh deploy */
        function triggerChunkReloadOnce() {
          try {
            var reloaded = sessionStorage.getItem('magoodhoo_chunk_reload');
            if (!reloaded) {
              sessionStorage.setItem('magoodhoo_chunk_reload', '1');
              window.location.reload();
            }
          } catch (e) {}
        }

        window.addEventListener('vite:preloadError', function(event) {
          if (event && event.preventDefault) event.preventDefault();
          triggerChunkReloadOnce();
        });

        /* Suppress disabled HMR WebSocket in cloud proxy/iFrame per environment constraints */
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            }
            if (isHmr) {
              var listeners = {};
              var mockSocket = {
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {
                  mockSocket.readyState = 3;
                  var cbs = listeners['close'] || [];
                  cbs.forEach(function(cb) {
                    try { cb({ wasClean: true, code: 1000, reason: 'normal' }); } catch(err) {}
                  });
                },
                addEventListener: function(event, cb) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb(new Event('open')); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return mockSocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var isWsError = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e.reason || e.error || e))) || '';
          return msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1;
        };

        var isChunkError = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e.reason || e.error || e))) || '';
          return /ChunkLoadError|Loading chunk|Failed to fetch dynamically imported module|Importing a module script failed/i.test(msg);
        };

        window.addEventListener('error', function(event) {
          if (isWsError(event)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
          if (isChunkError(event)) {
            triggerChunkReloadOnce();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return;
          }
          if (isChunkError(event)) {
            if (event.preventDefault) event.preventDefault();
            triggerChunkReloadOnce();
          }
        }, true);
      })();
    </script>
    <title>Magoodhoo School Library Portal — Digital Catalog & Circulation</title>

    />

    <!-- Instant Pre-Hydration App Shell Skeleton Styles (CLS=0 aligned with React layout) -->
    <style>
      #boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #F7F5F0;
        color: #1C1917;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      html[dir="rtl"] #boot-shell {
        font-family: 'Faruma', 'Noto Sans Thaana', sans-serif;
      }
      html.dark #boot-shell {
        background: #121413;
        color: #F5F3EE;
      }
      .boot-topbar {
        height: 64px;
        background: #FFFFFF;
        border-bottom: 1px solid #E2DDD5;
        width: 100%;
        box-sizing: border-box;
      }
      .boot-topbar-inner {
        max-width: 1600px;
        height: 100%;
        margin: 0 auto;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .boot-topbar-inner { padding: 0 24px; }
      }
      html.dark .boot-topbar {
        background: #1A1D1B;
        border-bottom-color: #2E3330;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: -0.02em;
      }
      .boot-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #0F4C45;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #F7F5F0;
        flex-shrink: 0;
      }
      .boot-body {
        flex: 1;
        display: flex;
      }
      .boot-sidebar {
        width: 256px;
        flex-shrink: 0;
        background: #0D2623;
        padding: 16px 12px;
        display: none;
        flex-direction: column;
        gap: 10px;
        border-inline-end: 1px solid #193D38;
        box-sizing: border-box;
      }
      html.dark .boot-sidebar {
        background: #161918;
        border-inline-end-color: #2E3330;
      }
      @media (min-width: 1024px) {
        .boot-sidebar {
          display: flex;
        }
      }
      .boot-main-scroll {
        flex: 1;
        padding: 12px;
        box-sizing: border-box;
      }
      @media (min-width: 640px) {
        .boot-main-scroll { padding: 24px; }
      }
      @media (min-width: 1024px) {
        .boot-main-scroll { padding: 32px; }
      }
      .boot-main {
        max-width: 1440px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .boot-shimmer {
        background: linear-gradient(90deg, #EFECE6 25%, #F7F5F0 50%, #EFECE6 75%);
        background-size: 200% 100%;
        animation: bootPulse 1.4s ease-in-out infinite;
        border-radius: 12px;
      }
      html.dark .boot-shimmer {
        background: linear-gradient(90deg, #1A1D1B 25%, #232724 50%, #1A1D1B 75%);
        background-size: 200% 100%;
      }
      .boot-dark-pill {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        height: 36px;
      }
      .boot-hero {
        height: 156px;
        border-radius: 24px;
        background: #FFFFFF;
        border: 1px solid #E2DDD5;
        padding: 24px;
        margin-bottom: 20px;
        box-sizing: border-box;
      }
      html.dark .boot-hero {
        background: #1A1D1B;
        border-color: #2E3330;
      }
      .boot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .boot-card {
        height: 310px;
        border-radius: 20px;
        background: #FFFFFF;
        border: 1px solid #E2DDD5;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
      }
      html.dark .boot-card {
        background: #1A1D1B;
        border-color: #2E3330;
      }
      @keyframes bootPulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body class="bg-[#F7F5F0] dark:bg-[#121413] text-[#1C1917] dark:text-[#F5F3EE] antialiased selection:bg-[#0F4C45] selection:text-white">

                  <path d="M19.5 7.5V15.5L21.75 13.8L24 15.5V7.5" fill="#C26D3A"/>
                  <path d="M7.5 26.5C10.5 24.8 13.5 24.8 16 26.5C18.5 24.8 21.5 24.8 24.5 26.5" stroke="#C26D3A" stroke-width="1.75" stroke-linecap="round"/>
                </svg>
              </span>
              <span>Magoodhoo School Library</span>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
              <div class="boot-shimmer" style="width:200px;height:34px;border-radius:10px;"></div>

          <main class="boot-main-scroll">
            <div class="boot-main">
              <div class="boot-hero">

              </div>
              <div class="boot-grid">
                <div class="boot-card">
                  <div class="boot-shimmer" style="flex:1;border-radius:14px;"></div>
                  <div class="boot-shimmer" style="height:14px;width:80%;"></div>
                  <div class="boot-shimmer" style="height:12px;width:55%;"></div>
                </div>
                <div class="boot-card">
                  <div class="boot-shimmer" style="flex:1;border-radius:14px;"></div>
                  <div class="boot-shimmer" style="height:14px;width:75%;"></div>
                  <div class="boot-shimmer" style="height:12px;width:50%;"></div>
                </div>
                <div class="boot-card">
                  <div class="boot-shimmer" style="flex:1;border-radius:14px;"></div>
                  <div class="boot-shimmer" style="height:14px;width:85%;"></div>
                  <div class="boot-shimmer" style="height:12px;width:60%;"></div>
                </div>
                <div class="boot-card">
                  <div class="boot-shimmer" style="flex:1;border-radius:14px;"></div>
                  <div class="boot-shimmer" style="height:14px;width:70%;"></div>
                  <div class="boot-shimmer" style="height:12px;width:45%;"></div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
