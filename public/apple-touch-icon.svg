<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Library Open Book Icon with Drop Shadow -->
  <g filter="url(#shadow)" transform="translate(96, 110)">
    <!-- Spine Central Bar -->
    <rect x="156" y="24" width="8" height="236" rx="4" fill="#cbd5e1" opacity="0.6"/>

    <!-- Left Book Page -->
    <path d="M156 48 C110 32, 40 40, 10 54 L10 248 C40 234, 110 228, 156 242 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="4"/>
    
    <!-- Left Page Texture / Text lines -->
    <path d="M36 94 C70 86, 112 84, 134 90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 126 C70 118, 112 116, 134 122" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 158 C70 150, 112 148, 134 154" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 190 C70 182, 112 180, 134 186" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <!-- Right Book Page -->
    <path d="M164 48 C210 32, 280 40, 310 54 L310 248 C280 234, 210 228, 164 242 Z" fill="#f8fafc" stroke="#f1f5f9" stroke-width="4"/>

    <!-- Right Page Texture / Text lines -->
    <path d="M186 90 C208 84, 250 86, 284 94" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M186 122 C208 116, 250 118, 284 126" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M186 154 C208 148, 250 150, 284 158" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M186 186 C208 180, 250 182, 284 190" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Floating Bookmark / Sparkle -->
    <path d="M152 14 L168 14 L168 96 L160 84 L152 96 Z" fill="url(#gold)"/>
    
    <!-- Top Sparkle -->
    <circle cx="280" cy="30" r="10" fill="#fbbf24"/>
    <polygon points="280,12 284,26 298,30 284,34 280,48 276,34 262,30 276,26" fill="#fef08a"/>
  </g>

  <!-- Bottom School Badge Bar -->
  <g transform="translate(136, 400)">
    <rect width="240" height="42" rx="21" fill="#0f172a" fill-opacity="0.4" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
    <text x="120" y="27" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MAGOODHOO</text>
  </g>
</svg>
